<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Building Book — Michigan Cannabis</title>
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#1a7a4a;--green-light:#e8f5ef;--green-dark:#15663e;--border:#e5e7eb;--bg:#f9fafb;--surface:#fff;--text:#111;--muted:#6b7280;--danger:#dc3545;--info-bg:#eff6ff;--info:#1d4ed8}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}
/* Header */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.logo{width:36px;height:36px;background:var(--green);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo i{color:white;font-size:20px}
.hdr-info{flex:1}
.hdr-title{font-size:16px;font-weight:600}
.hdr-sub{font-size:12px;color:var(--muted)}
/* Tabs */
.tabs{background:var(--surface);border-bottom:1px solid var(--border);display:flex;padding:0 20px;flex-shrink:0}
.tab{padding:11px 18px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;transition:all .15s;display:flex;align-items:center;gap:6px}
.tab.active{color:var(--green);border-bottom-color:var(--green)}
.tab:hover:not(.active){color:var(--text);background:#f5f5f5}
/* Filters */
.filters{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex-shrink:0}
.search-wrap{flex:1;min-width:220px;position:relative}
.search-wrap input{width:100%;padding:8px 12px 8px 34px;font-size:13px;border:1px solid var(--border);border-radius:8px;background:var(--bg)}
.search-wrap input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(26,122,74,.1)}
.search-wrap .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px}
.fselect{padding:8px 12px;font-size:13px;border:1px solid var(--border);border-radius:8px;background:var(--bg);cursor:pointer;color:var(--text)}
.fselect:focus{outline:none;border-color:var(--green)}
/* Main layout */
.main{display:flex;flex:1;overflow:hidden}
/* List */
.list-pane{width:340px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface)}
.list-header{padding:10px 16px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:#f5f5f5;border-bottom:1px solid var(--border);flex-shrink:0}
.list-body{overflow-y:auto;flex:1}
.lcard{padding:13px 16px;border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background .1s}
.lcard:hover{background:#f8f8f8}
.lcard.sel{background:var(--green-light);border-left:3px solid var(--green)}
.lcard-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.lcard-addr{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:10px;padding:2px 7px;border-radius:999px;font-weight:600}
.badge-retailer{background:#dcfce7;color:#15803d}
.badge-grower{background:#dbeafe;color:#1d4ed8}
.badge-processor{background:#fef3c7;color:#92400e}
.badge-other,.badge-entity{background:#f3f4f6;color:#374151}
.badge-event{background:#fce7f3;color:#9d174d}
.badge-both{background:#d1fae5;color:#065f46}
.badge-medical{background:#fee2e2;color:#991b1b}
.badge-adult{background:#dbeafe;color:#1e40af}
.badge-warn{background:#fee2e2;color:#991b1b}
.badge-del{background:#d1fae5;color:#065f46}
.no-results{padding:32px 16px;text-align:center;color:var(--muted);font-size:13px}
.load-more{padding:12px;text-align:center;border-top:1px solid var(--border)}
.load-more button{padding:8px 20px;font-size:13px;border:1px solid var(--border);border-radius:8px;background:white;cursor:pointer;font-weight:500}
.load-more button:hover{background:#f5f5f5}
/* Detail */
.detail-pane{flex:1;overflow-y:auto;padding:24px;background:var(--bg)}
.empty-state{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted)}
.empty-state i{font-size:48px;opacity:.2}
.d-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.d-titlerow{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:12px}
.d-title{font-size:18px;font-weight:600}
.d-addr{font-size:13px;color:var(--muted);margin-bottom:16px}
.d-addr a{color:var(--green)}
.d-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f5f5f5;font-size:13px;gap:16px}
.d-row:last-child{border-bottom:none}
.d-label{color:var(--muted)}
.d-val{font-weight:500;text-align:right}
.section-ttl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:14px}
/* CRM form */
.cf-grid{display:grid;gap:12px}
.cf-row2{grid-template-columns:1fr 1fr}
.cf-label{font-size:12px;color:var(--muted);margin-bottom:4px;display:block;font-weight:500}
.cf-input{width:100%;padding:8px 11px;font-size:13px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
.cf-input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(26,122,74,.1)}
textarea.cf-input{resize:vertical;min-height:80px;font-family:inherit}
.btn-row{display:flex;gap:8px;margin-top:4px}
.btn{padding:8px 16px;font-size:13px;border-radius:8px;cursor:pointer;border:1px solid var(--border);background:white;color:var(--text);font-weight:500;transition:all .15s}
.btn:hover{background:#f5f5f5}
.btn.primary{background:var(--green);color:white;border-color:var(--green)}
.btn.primary:hover{background:var(--green-dark)}
/* Visits */
.vitem{padding:11px 0;border-bottom:1px solid #f5f5f5;font-size:13px}
.vitem:last-child{border-bottom:none}
.vdate{font-size:11px;color:var(--muted);margin-bottom:3px}
.vnotes{color:var(--muted);font-size:12px;margin-top:4px}
/* Stage pill */
.stage-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600}
.stage-prospect{background:#f3f4f6;color:#374151}
.stage-contacted{background:#dbeafe;color:#1e40af}
.stage-visited{background:#fef3c7;color:#92400e}
.stage-customer{background:#d1fae5;color:#065f46}
.stage-inactive{background:#f3f4f6;color:#9ca3af}
/* Stats pane */
.stats-pane{flex:1;overflow-y:auto;padding:24px;background:var(--bg)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center}
.stat-num{font-size:28px;font-weight:700;color:var(--green)}
.stat-num.red{color:var(--danger)}
.stat-label{font-size:12px;color:var(--muted);margin-top:3px}
.city-list{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.city-row{display:flex;align-items:center;padding:10px 16px;border-bottom:1px solid #f5f5f5;font-size:13px;gap:12px}
.city-row:last-child{border-bottom:none}
.city-name{flex:1;font-weight:500}
.bar-wrap{width:120px;height:6px;background:#f0f0f0;border-radius:3px}
.bar{height:100%;background:var(--green);border-radius:3px}
.city-n{font-size:12px;color:var(--muted);min-width:32px;text-align:right}
h3.section-h{font-size:13px;font-weight:600;margin-bottom:12px;color:var(--text)}
</style>
</head>

const ALL = DATA_RAW.map(r => ({id:r[0],name:r[1],address:r[2],type:r[3],program:r[4],status:r[5],expires:r[6],homeDelivery:!!r[7],disciplinary:!!r[8],licenseCount:r[9]}));

let filtered = [...ALL];
let sel = null;
let pg = 0;
const PS = 60;
const crm = {};

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function typeB(t){
  const m = {Retailer:'retailer',Grower:'grower',Processor:'processor',Other:'other',Event:'event',Entity:'entity'};
  return `<span class="badge badge-${m[t]||'other'}">${t}</span>`;
}
function progB(p){
  const m = {'Adult-Use':'adult',Medical:'medical',Both:'both'};
  return `<span class="badge badge-${m[p]||'other'}">${p}</span>`;
}

function getCity(a){
  const m = a.match(/,\s*([^,]+?)\s+MI\s+\d/);
  return m ? m[1].trim() : '';
}

function search(){
  const q = document.getElementById('q').value.toLowerCase().trim();
  const t = document.getElementById('tf').value;
  const p = document.getElementById('pf').value;
  filtered = ALL.filter(r => {
    if(t && r.type!==t) return false;
    if(p && r.program!==p) return false;
    if(q) return r.name.toLowerCase().includes(q)||r.address.toLowerCase().includes(q)||r.id.toLowerCase().includes(q);
    return true;
  });
  pg = 0;
  renderList();
}

function renderList(){
  document.getElementById('lhdr').textContent = filtered.length.toLocaleString() + ' location' + (filtered.length!==1?'s':'');
  document.getElementById('hdr-count').textContent = filtered.length.toLocaleString() + ' of ' + ALL.length.toLocaleString() + ' active Michigan licenses';
  const page = filtered.slice(0,(pg+1)*PS);
  const lb = document.getElementById('lbody');
  
  if(!filtered.length){
    lb.innerHTML='<div class="no-results"><i class="ti ti-search-off" style="font-size:32px;opacity:.3;display:block;margin-bottom:8px"></i>No locations found</div>';
    return;
  }
  
  lb.innerHTML = page.map(r => {
    const cls = sel && sel.id===r.id ? ' sel' : '';
    return `<div class="lcard${cls}" onclick="selectR('${r.id}')">
      <div class="lcard-name">${esc(r.name)}</div>
      <div class="lcard-addr">${esc(r.address)}</div>
      <div class="badges">
        ${typeB(r.type)}${progB(r.program)}
        ${r.homeDelivery ? '<span class="badge badge-del">Delivery</span>' : ''}
        ${r.disciplinary ? '<span class="badge badge-warn">⚠ Disciplinary</span>' : ''}
      </div>
    </div>`;
  }).join('');
  
  if(filtered.length > (pg+1)*PS){
    lb.insertAdjacentHTML('beforeend', `<div class="load-more"><button onclick="pg++;renderList()">Load more (${filtered.length-(pg+1)*PS} remaining)</button></div>`);
  }
}

function selectR(id){
  sel = ALL.find(r=>r.id===id);
  renderList();
  renderDetail();
}

function renderDetail(){
  if(!sel) return;
  const r = sel;
  const c = crm[r.id] || {contact:'',phone:'',email:'',stage:'prospect',notes:'',visits:[]};
  const murl = `https://maps.google.com/?q=${encodeURIComponent(r.address)}`;
  
  document.getElementById('dpane').innerHTML = `
    <div class="d-card">
      <div class="d-titlerow">
        <div class="d-title">${esc(r.name)}</div>
        ${typeB(r.type)}
      </div>
      <div class="d-addr"><a href="${murl}" target="_blank"><i class="ti ti-map-pin"></i> ${esc(r.address)} ↗</a></div>
      <div class="d-row"><span class="d-label">License #</span><span class="d-val" style="font-family:monospace;font-size:12px">${esc(r.id)}</span></div>
      <div class="d-row"><span class="d-label">Program</span><span class="d-val">${progB(r.program)}</span></div>
      <div class="d-row"><span class="d-label">Status</span><span class="d-val">${esc(r.status)}</span></div>
      <div class="d-row"><span class="d-label">Expires</span><span class="d-val">${esc(r.expires)||'—'}</span></div>
      <div class="d-row"><span class="d-label">License count on file</span><span class="d-val">${r.licenseCount}</span></div>
      ${r.homeDelivery ? '<div class="d-row"><span class="d-label">Home Delivery</span><span class="d-val" style="color:#15803d">✓ Authorized</span></div>' : ''}
      ${r.disciplinary ? '<div class="d-row"><span class="d-label">Disciplinary</span><span class="d-val" style="color:#dc3545">⚠ Action on record</span></div>' : ''}
    </div>

    <div class="d-card">
      <div class="section-ttl">Account CRM</div>
      <div class="cf-grid">
        <div>
          <label class="cf-label">Stage</label>
          <select class="cf-input" id="c-stage" onchange="saveC()">
            ${['prospect','contacted','visited','customer','inactive'].map(s=>`<option value="${s}" ${c.stage===s?'selected':''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('')}
          </select>
        </div>
        <div class="cf-grid cf-row2">
          <div>
            <label class="cf-label">Contact name</label>
            <input class="cf-input" id="c-contact" value="${esc(c.contact)}" placeholder="Buyer / GM name" oninput="saveC()">
          </div>
          <div>
            <label class="cf-label">Phone</label>
            <input class="cf-input" type="tel" id="c-phone" value="${esc(c.phone)}" placeholder="(555) 000-0000" oninput="saveC()">
          </div>
        </div>
        <div>
          <label class="cf-label">Email</label>
          <input class="cf-input" type="email" id="c-email" value="${esc(c.email)}" placeholder="buyer@dispensary.com" oninput="saveC()">
        </div>
        <div>
          <label class="cf-label">Notes (brands carried, preferences, sample history)</label>
          <textarea class="cf-input" id="c-notes" oninput="saveC()">${esc(c.notes)}</textarea>
        </div>
      </div>
    </div>

    <div class="d-card">
      <div class="section-ttl">Visit Log</div>
      <div class="cf-grid" style="margin-bottom:16px">
        <div class="cf-grid cf-row2">
          <div>
            <label class="cf-label">Date</label>
            <input class="cf-input" type="date" id="v-date" value="${new Date().toISOString().slice(0,10)}">
          </div>
          <div>
            <label class="cf-label">Type</label>
            <select class="cf-input" id="v-type">
              <option>Cold call</option><option>Follow-up</option><option>Sample drop</option><option>Order placed</option><option>Check-in</option><option>Pitch meeting</option>
            </select>
          </div>
        </div>
        <div>
          <label class="cf-label">Notes</label>
          <textarea class="cf-input" id="v-notes" placeholder="Products shown, feedback, next steps..."></textarea>
        </div>
        <div class="btn-row"><button class="btn primary" onclick="logVisit()"><i class="ti ti-plus"></i> Log visit</button></div>
      </div>
      <div id="vlist">${renderVisits(c.visits)}</div>
    </div>`;
}

function renderVisits(visits){
  if(!visits||!visits.length) return '<div style="font-size:13px;color:#9ca3af;padding:4px 0">No visits logged yet.</div>';
  return visits.slice().reverse().map(v=>`<div class="vitem"><div class="vdate">${esc(v.date)}</div><span class="badge badge-retailer">${esc(v.type)}</span>${v.notes?`<div class="vnotes">${esc(v.notes)}</div>`:''}</div>`).join('');
}

function saveC(){
  if(!sel) return;
  if(!crm[sel.id]) crm[sel.id] = {visits:[]};
  crm[sel.id].contact = document.getElementById('c-contact').value;
  crm[sel.id].phone = document.getElementById('c-phone').value;
  crm[sel.id].email = document.getElementById('c-email').value;
  crm[sel.id].notes = document.getElementById('c-notes').value;
  crm[sel.id].stage = document.getElementById('c-stage').value;
}

function logVisit(){
  if(!sel) return;
  if(!crm[sel.id]) crm[sel.id]={contact:'',phone:'',email:'',stage:'prospect',notes:'',visits:[]};
  crm[sel.id].visits.push({date:document.getElementById('v-date').value,type:document.getElementById('v-type').value,notes:document.getElementById('v-notes').value});
  if(crm[sel.id].stage==='prospect'){crm[sel.id].stage='contacted';document.getElementById('c-stage').value='contacted';}
  document.getElementById('vlist').innerHTML = renderVisits(crm[sel.id].visits);
  document.getElementById('v-notes').value='';
}

function switchTab(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  if(t==='dir'){
    document.getElementById('dir-pane').style.display='flex';
    document.getElementById('stats-pane').style.display='none';
    document.getElementById('fbar').style.display='flex';
  } else {
    document.getElementById('dir-pane').style.display='none';
    document.getElementById('stats-pane').style.display='block';
    document.getElementById('fbar').style.display='none';
    renderStats();
  }
}

function renderStats(){
  const cities={},types={};
  let retailers=0,growers=0,processors=0,both=0,disc=0,del=0;
  ALL.forEach(r=>{
    types[r.type]=(types[r.type]||0)+1;
    const city=getCity(r.address);
    if(city) cities[city]=(cities[city]||0)+1;
    if(r.type==='Retailer') retailers++;
    if(r.type==='Grower') growers++;
    if(r.type==='Processor') processors++;
    if(r.program==='Both') both++;
    if(r.disciplinary) disc++;
    if(r.homeDelivery) del++;
  });
  const crmN=Object.keys(crm).length;
  const cust=Object.values(crm).filter(c=>c.stage==='customer').length;
  const vis=Object.values(crm).filter(c=>c.stage==='visited'||c.stage==='customer').length;
  const topCities=Object.entries(cities).sort((a,b)=>b[1]-a[1]).slice(0,25);
  const maxC=topCities[0][1];
  
  document.getElementById('stats-pane').innerHTML=`
    <h3 class="section-h" style="margin-bottom:14px">License overview — Michigan cannabis operators</h3>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num">${ALL.length.toLocaleString()}</div><div class="stat-label">Active locations</div></div>
      <div class="stat-card"><div class="stat-num">${retailers.toLocaleString()}</div><div class="stat-label">Retailers</div></div>
      <div class="stat-card"><div class="stat-num">${growers.toLocaleString()}</div><div class="stat-label">Growers</div></div>
      <div class="stat-card"><div class="stat-num">${processors.toLocaleString()}</div><div class="stat-label">Processors</div></div>
      <div class="stat-card"><div class="stat-num">${both.toLocaleString()}</div><div class="stat-label">Dual licensed</div></div>
      <div class="stat-card"><div class="stat-num">${del.toLocaleString()}</div><div class="stat-label">Home delivery</div></div>
      <div class="stat-card"><div class="stat-num red">${disc.toLocaleString()}</div><div class="stat-label">Disciplinary actions</div></div>
    </div>
    <h3 class="section-h" style="margin-bottom:14px">Your CRM pipeline</h3>
    <div class="stats-grid" style="margin-bottom:28px">
      <div class="stat-card"><div class="stat-num">${crmN}</div><div class="stat-label">Accounts tracked</div></div>
      <div class="stat-card"><div class="stat-num">${vis}</div><div class="stat-label">Visited</div></div>

    </div>
    <h3 class="section-h" style="margin-bottom:12px">Top cities by active location count</h3>
    <div class="city-list">

    </div>
  `;
}
